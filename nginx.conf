user nobody;
worker_processes auto;
pid /run/nginx.pid;

env REDIS_HOST;
env REDIS_PORT;
env REDIS_PASSWORD;
env REDIS_DB;
env BACKEND_URL;
env APP_PORT;
env APP_NAME;

events {
  worker_connections 1024;
}

http {
  # Log format with emojis
  log_format main_with_emojis '🌐 [$time_local] 📍 $remote_addr '
                             '📝 "$request" ⚡ $status '
                             '📊 $body_bytes_sent '
                             '🔗 "$http_referer" 🌍 "$http_user_agent"';

  # The "auto_ssl" shared dict should be defined with enough storage space to
  # hold your certificate data. 1MB of storage holds certificates for
  # approximately 100 separate domains.
  lua_shared_dict auto_ssl 10m;
  # The "auto_ssl_settings" shared dict is used to temporarily store various settings
  # like the secret used by the hook server on port 8999. Do not change or
  # omit it.
  lua_shared_dict auto_ssl_settings 64k;

  # A DNS resolver must be defined for OCSP stapling to function.
  #
  # This example uses Google's DNS server. You may want to use your system's
  # default DNS servers, which can be found in /etc/resolv.conf. If your network
  # is not IPv6 compatible, you may wish to disable IPv6 results by using the
  # "ipv6=off" flag (like "resolver 8.8.8.8 ipv6=off").
  resolver 8.8.8.8;

  # Initial setup tasks.
  rewrite_by_lua_block {
    auto_ssl = (require "resty.auto-ssl").new()
    auto_ssl:set("redis", {
      host = os.getenv("REDIS_HOST") or "127.0.0.1",
      port = tonumber(os.getenv("REDIS_PORT")) or 6379,
      db = os.getenv("REDIS_DB") or 0,
      auth = os.getenv("REDIS_PASSWORD") or ""
    })
    auto_ssl:set("storage_adapter", "resty.auto-ssl.storage_adapters.redis")

    -- Define a function to determine which SNI domains to automatically handle
    -- and register new certificates for. Defaults to not allowing any domains,
    -- so this must be configured.
    auto_ssl:set("allow_domain", function(domain)
      local http = require "resty.http"
      local httpc = http.new()
      local res, err = httpc:request_uri(os.getenv("BACKEND_URL"), {
        method = "GET",
        headers = {
          ["Content-Type"] = "application/json"
        }
      })
      
      if not res then
        ngx.log(ngx.ERR, "Failed to fetch domains: ", err)
        return false
      end
      
      if res.status ~= 200 then
        ngx.log(ngx.ERR, "Invalid response status: ", res.status)
        return false
      end
      
      local cjson = require "cjson"
      local response = cjson.decode(res.body)
      local domains = response.domains
      
      for _, domain in ipairs(domains) do
        if domain == ngx.var.ssl_server_name then
          return true
        end
      end
      return false
    end)

    auto_ssl:init()
  }

  init_worker_by_lua_block {
    auto_ssl:init_worker()
  }

  # Basic Settings
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  # MIME Types
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # SSL Settings
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:50m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Logging
  access_log /var/log/nginx/access.log main_with_emojis;
  error_log /var/log/nginx/error.log warn;

  # Gzip Settings
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Virtual Host Configs
  include /etc/nginx/conf.d/*.conf;
  include /etc/nginx/sites-enabled/*;

  # Internal server running on port 8999 for handling certificate tasks.
  server {
    listen 127.0.0.1:8999;

    # Increase the body buffer size, to ensure the internal POSTs can always
    # parse the full POST contents into memory.
    client_body_buffer_size 128k;
    client_max_body_size 128k;

    location / {
      content_by_lua_block {
        auto_ssl:hook_server()
      }
    }
  }

  # HTTPS server
  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    # Dynamic handler for issuing or returning certs for SNI domains.
    ssl_certificate_by_lua_block {
      auto_ssl:ssl_certificate()
    }

    # Fallback certificates
    ssl_certificate /etc/nginx/ssl/resty-auto-ssl-fallback.crt;
    ssl_certificate_key /etc/nginx/ssl/resty-auto-ssl-fallback.key;

    # Proxy to frontend app
    location / {
      set_by_lua $proxy_pass '
        return "http://" .. os.getenv("APP_NAME") .. ":" .. os.getenv("APP_PORT")
      ';
      proxy_pass $proxy_pass;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # HTTP server
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Endpoint used for performing domain verification with Let's Encrypt.
    location /.well-known/acme-challenge/ {
      content_by_lua_block {
        auto_ssl:challenge_server()
      }
    }
    # Redirect all HTTP traffic to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }

    # Serve build info from public folder
    location /build-info {
      root /var/www/html;
      try_files $uri $uri/ /build-info.txt @build-info-fallback;
    }

    location @build-info-fallback {
      return 200 '{"version": "1.0.0", "commit": "1234567890"}';
    }
  }
}